name: CI/CD for NestJS Fastify Backend

on:
  push:
    branches:
      - production 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Code
        uses: actions/checkout@v3

      - name: 🏗️ Install Bun
        shell: bash
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version  # Verify installation

      - name: 📦 Cache Bun Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: 🔧 Install zip (Ubuntu)
        run: sudo apt update && sudo apt install zip -y

      - name: 🔨 Build Project
        run: bun run build

      - name: ✅ Run Tests
        run: bun run test
        env:
          NODE_ENV: test
        continue-on-error: false  # Fail if tests fail

      - name: 📦 Package for Deployment
        run: |
            mkdir -p deploy
            cp -r dist deploy/
            cp package.json deploy/
            cp -r node_modules deploy/
            if [ -f bun.lockb ]; then cp bun.lockb deploy/; else echo "Skipping bun.lockb"; fi
            cd deploy && zip -r deploy.zip .

      - name: ✅ Verify AWS Authentication
        run: aws sts get-caller-identity

      - name: 🚀 Deploy to AWS Lambda 2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1  # Adjust to your region
        run: |
          aws lambda update-function-code \
            --function-name MyNestFastifyApp \
            --zip-file fileb://deploy/deploy.zip
