name: CI/CD for NestJS Fastify Backend

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Code
        uses: actions/checkout@v3

      - name: 🏗️ Install Bun
        shell: bash
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version  # Verify installation

      - name: 📦 Cache Bun Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: 🔧 Install zip (Ubuntu)
        run: sudo apt update && sudo apt install zip -y

      - name: 🔨 Build Project
        run: |
          set -e  # Stop execution if the build fails
          bun run build

      - name: ✅ Run Tests
        run: |
          set -e  # Stop if tests fail
          bun run test
        env:
          NODE_ENV: test

      - name: 📦 Package for Deployment
        run: |
          mkdir -p deploy
          cp -r dist package.json deploy/
          [ -f bun.lockb ] && cp bun.lockb deploy/
          cd deploy && zip -r deploy.zip .

      - name: 🛠️ Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🚀 Upload to S3
        run: |
          aws s3 cp deploy/deploy.zip s3://serverless-framework-deployments-us-east-1-1e5a5836-468b/deploy.zip

      - name: 🔄 Update Lambda from S3
        run: |
          aws lambda update-function-code \
            --function-name nestjs-prisma-service-dev-app \
            --s3-bucket serverless-framework-deployments-us-east-1-1e5a5836-468b \
            --s3-key deploy.zip
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
